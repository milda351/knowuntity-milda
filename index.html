<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowunity Downloader</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #0f172a; 
            color: #f8fafc; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            padding: 1rem; 
            box-sizing: border-box; 
        }
        .card { 
            background: #1e293b; 
            padding: 2rem; 
            border-radius: 1rem; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            width: 100%; 
            max-width: 440px; 
            box-sizing: border-box; 
            text-align: center; 
        }
        h2 { 
            margin-top: 0; 
            font-size: 1.5rem; 
            color: #38bdf8; 
        }
        input { 
            width: 100%; 
            padding: 0.75rem; 
            border-radius: 0.5rem; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: #fff; 
            margin-bottom: 1rem; 
            box-sizing: border-box; 
            font-size: 1rem; 
        }
        input:focus {
            outline: 2px solid #38bdf8;
            border-color: transparent;
        }
        button, .dl-btn { 
            width: 100%; 
            padding: 0.75rem; 
            border-radius: 0.5rem; 
            border: none; 
            background: #0ea5e9; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            display: inline-block; 
            box-sizing: border-box; 
            font-size: 1rem; 
            transition: background 0.2s;
        }
        button:hover, .dl-btn:hover { 
            background: #0284c7; 
        }
        button:disabled {
            background: #475569;
            cursor: not-allowed;
        }
        #status { 
            margin-top: 1rem; 
            font-size: 0.9rem; 
            color: #94a3b8; 
            word-break: break-word; 
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Knowunity Downloader</h2>
        <input type="text" id="urlInput" placeholder="Vlož odkaz z Knowunity">
        <button id="submitBtn" onclick="processKnowunity()">Získat PDF</button>
        <div id="status"></div>
    </div>

    <script>
    const WORKER_BASE_URL = "https://knowunity-proxy.hebronmilan89.workers.dev";

    async function processKnowunity() {
        const urlInput = document.getElementById('urlInput').value.trim();
        const status = document.getElementById('status');
        const submitBtn = document.getElementById('submitBtn');

        if (!urlInput) {
            status.innerHTML = "❌ Vlož prosím odkaz.";
            return;
        }

        status.innerHTML = "⏳ Zpracovávám...";
        submitBtn.disabled = true;

        try {
            const res = await fetch(`${WORKER_BASE_URL}?url=${encodeURIComponent(urlInput)}`);
            const data = await res.json();

            if (!res.ok) {
                status.innerHTML = `❌ Chyba (${res.status}): ${data.error || 'Neznámá chyba'}`;
                submitBtn.disabled = false;
                return;
            }

            const title = (data.title || "dokument").replace(/[\\/*?:"<>|]/g, "").trim();
            const pdfUrl = data.pdfUrl;

            if (!pdfUrl) {
                status.innerHTML = "❌ Příspěvek neobsahuje přímý PDF odkaz.";
                submitBtn.disabled = false;
                return;
            }

            status.innerHTML = `
                <p style="color: #4ade80; font-weight: bold; margin-bottom: 0.5rem;">✅ Nalezeno!</p>
                <p style="color: #cbd5e1; margin-bottom: 1rem;">${title}</p>
                <a href="${pdfUrl}" target="_blank" class="dl-btn">Otevřít / Stáhnout PDF</a>
            `;
        } catch (err) {
            status.innerHTML = `❌ Chyba připojení: ${err.message}`;
        } finally {
            submitBtn.disabled = false;
        }
    }
    </script>
</body>
</html>
