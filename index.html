<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knowunity PDF Downloader</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 2rem; border-radius: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3); width: 100%; max-width: 400px; box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 1.5rem; text-align: center; color: #38bdf8; }
        input { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 1rem; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: none; background: #0ea5e9; color: white; font-weight: bold; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0284c7; }
        #status { margin-top: 1rem; text-align: center; font-size: 0.9rem; color: #94a3b8; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Knowunity Downloader</h2>
        <input type="text" id="urlInput" placeholder="Vlož odkaz (např. https://knowunity.cz/knows/...)">
        <button onclick="downloadPdf()">Stáhnout PDF</button>
        <div id="status"></div>
    </div>

    <script>
        async function downloadPdf() {
            const urlInput = document.getElementById('urlInput').value.trim();
            const status = document.getElementById('status');
            
            const match = urlInput.match(/([a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12})/i);
            if (!match) {
                status.innerHTML = "❌ Neplatný odkaz na Knowunity!";
                return;
            }

            const knowId = match[1];
            status.innerHTML = "⏳ Načítám data...";

            // Použijeme veřejnou CORS proxy, aby mobilní prohlížeč neblokoval požadavek
            const apiUrl = `https://knowunity.com/api/knows-v2/${knowId}`;
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(apiUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                const json = await response.json();
                const data = JSON.parse(json.contents);

                const title = (data.title || "dokument").replace(/[\\/*?:"<>|]/g, "").trim();
                const documents = data.documents || [];

                if (!documents.length || !documents[0].contentUrl) {
                    status.innerHTML = "❌ Dokument neobsahuje PDF.";
                    return;
                }

                const pdfUrl = documents[0].contentUrl;
                status.innerHTML = "📥 Stahuji soubor...";

                // Stažení přes blob pro mobilní prohlížeče
                const pdfResponse = await fetch(`https://api.allorigins.win/raw?url=${encodeURIComponent(pdfUrl)}`);
                const blob = await pdfResponse.blob();
                
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = blobUrl;
                a.download = `${title}.pdf`;
                document.body.appendChild(a);
                a.click();
                a.remove();

                status.innerHTML = "✅ Hotovo! PDF je stažené 🔥";
            } catch (err) {
                status.innerHTML = "❌ Chyba při stahování. Zkus to znovu.";
                console.error(err);
            }
        }
    </script>
</body>
</html>
